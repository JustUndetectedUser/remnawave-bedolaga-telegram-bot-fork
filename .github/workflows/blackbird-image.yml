# BlackBird: образ бота с меню и ответами в переписке.
#
# Собирается из ветки blackbird и тегов bb-* и кладётся в GHCR этого
# репозитория. Лицензия форка та же, что у Bedolaga: MIT с условием Commons Clause (см. LICENSE).
#
# Теги образа: bb-<версия> для тега git (например bb-5.1.1-1), blackbird —
# последняя сборка ветки, sha-<коммит> — каждая сборка.
name: BlackBird image

on:
  workflow_dispatch:
  push:
    branches: [blackbird]
    tags: ['bb-*']

# Actions закреплены на коммитах, а не на тегах: тег можно переставить, а у задания есть право
# записи в пакеты (packages: write). В комментарии — тег, которому коммит соответствовал 14.11.2026.
permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Tests
        run: |
          uv sync --frozen
          uv run pytest -q tests/bb

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
