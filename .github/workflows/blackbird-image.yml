# BlackBird: образ бота с меню и ответами в переписке.
#
# Собирается из ветки blackbird и тегов bb-* и кладётся в GHCR этого
# репозитория. Лицензия форка та же, что у Bedolaga: MIT с условием Commons Clause (см. LICENSE).
#
# Теги образа: bb-<версия> для тега git (например bb-5.1.1-1), blackbird —
# последняя сборка ветки, sha-<коммит> — каждая сборка.
name: BlackBird image

on:
  workflow_dispatch:
  push:
    branches: [blackbird]
    tags: ['bb-*']

# Actions закреплены на коммитах, а не на тегах: тег можно переставить, а у задания есть право
# записи в пакеты (packages: write). В комментарии — тег, которому коммит соответствовал 14.11.2026.
permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Tests
        run: |
          uv sync --frozen
          uv run pytest -q tests/bb tests/services/test_cashera_import_cycle.py

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
